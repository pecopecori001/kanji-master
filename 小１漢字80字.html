<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小学1年 漢字マスター</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;font-family:"UD Digi Kyokasho NK-R","Yu Kyokasho","游教科書体","Noto Serif JP",serif;color:#222}

.stats{display:flex;gap:5px;margin:7px 0}.stat{flex:1;background:#fff;border-radius:10px;padding:7px 4px;text-align:center;font-size:11px}.stat b{font-size:16px;margin-left:3px}
.card{background:#fff;min-height:300px;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 18px #0001;cursor:pointer;user-select:none}.q{font-size:25px;line-height:1.65;font-weight:600}.target-reading{color:#c62828;font-weight:800;text-decoration:underline 2px;text-underline-offset:4px}.num{font-size:13px;color:#777;margin-bottom:10px}.big{font-size:70px;line-height:1.1}.answer{font-size:25px;line-height:1.55;margin-top:5px;font-weight:700}.reading{font-size:18px;color:#555;margin-top:3px}
.stroke{width:132px;height:132px;margin:8px auto;border:1px solid #ddd;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff}.stroke svg{width:124px;height:124px}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;position:sticky;bottom:5px;background:#f5f4ef;padding-top:5px}.judge{border:0;border-radius:12px;padding:11px 3px;font-weight:700;font-size:14px;cursor:pointer}.bad{background:#ffdeda}.maybe{background:#fff0c9}.good{background:#dcefdc}
.reset{width:100%;border:0;border-radius:12px;margin-top:7px;padding:10px;background:#e8e8e8;font-weight:700;cursor:pointer}.hint{font-size:11px;color:#888;margin-top:8px}.replay{border:0;border-radius:10px;background:#e8f3ff;color:#1261a0;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer}.done{font-size:23px;font-weight:700;line-height:1.6}.result{font-size:14px;line-height:1.8;margin-top:8px}.progress{height:8px;background:#e6e6e6;border-radius:6px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:#aaa}.note{font-size:10px;color:#888;text-align:center;margin-top:10px;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}
</style></head><body><div class="app" id="app"></div>
<script>
const OKURI={"大":"きい","小":"さい","早":"く","入":"る","立":"つ","見":"る","出":"る","正":"しい","引":"く","遠":"い","楽":"しい","帰":"る","強":"い","教":"える","近":"い","古":"い","後":"","広":"い","考":"える","行":"く","高":"い","合":"う","細":"い","作":"る","止":"まる","思":"う","弱":"い","書":"く","少":"ない","食":"べる","新":"しい","晴":"れる","切":"る","走":"る","多":"い","太":"い","知":"る","長":"い","直":"す","通":"る","当":"たる","答":"える","同":"じ","読":"む","売":"る","買":"う","分":"かる","聞":"く","歩":"く","明":"るい","鳴":"く","来":"る","話":"す","悪":"い","安":"い","暗":"い","育":"てる","飲":"む","運":"ぶ","泳":"ぐ","温":"かい","開":"く","寒":"い","起":"きる","急":"ぐ","苦":"しい","軽":"い","決":"める","向":"く","使":"う","始":"める","持":"つ","守":"る","取":"る","受":"ける","拾":"う","終":"わる","習":"う","集":"める","住":"む","重":"い","暑":"い","助":"ける","消":"す","勝":"つ","乗":"る","植":"える","申":"す","深":"い","進":"む","整":"える","送":"る","速":"い","打":"つ","待":"つ","短":"い","着":"る","調":"べる","追":"う","定":"める","転":"ぶ","投":"げる","登":"る","動":"く","配":"る","悲":"しい","美":"しい","負":"ける","平":"ら","返":"す","放":"す","問":"う","遊":"ぶ","落":"ちる","流":"れる","栄":"える","加":"える","果":"たす","改":"める","覚":"える","泣":"く","挙":"げる","競":"う","欠":"ける","結":"ぶ","建":"てる","固":"い","好":"き","残":"る","治":"す","失":"う","借":"りる","祝":"う","笑":"う","唱":"える","焼":"く","照":"らす","成":"る","清":"い","静":"か","積":"む","折":"る","浅":"い","戦":"う","選":"ぶ","争":"う","続":"く","置":"く","低":"い","努":"める","働":"く","熱":"い","敗":"れる","飛":"ぶ","必":"ず","付":"ける","富":"む","別":"れる","変":"わる","包":"む","望":"む","満":"ちる","勇":"む","要":"る","養":"う","浴":"びる","良":"い","冷":"たい","連":"なる","老":"いる"};
const GRADE=1,QUESTIONS=[{"num":1,"k":"一","reading":"いち","prompt":"いち年生に なる。","answer":"一年生に なる。"},{"num":2,"k":"右","reading":"みぎ","prompt":"みぎを向く。","answer":"右を向く。"},{"num":3,"k":"雨","reading":"あめ","prompt":"あめがふる。","answer":"雨がふる。"},{"num":4,"k":"円","reading":"えん","prompt":"百えん玉。","answer":"百円玉。"},{"num":5,"k":"王","reading":"おう","prompt":"国のおうさま。","answer":"国の王さま。"},{"num":6,"k":"音","reading":"おと","prompt":"大きなおとがする。","answer":"大きな音がする。"},{"num":7,"k":"下","reading":"した","prompt":"机のした。","answer":"机の下。"},{"num":8,"k":"火","reading":"ひ","prompt":"ひを消す。","answer":"火を消す。"},{"num":9,"k":"花","reading":"はな","prompt":"はながさく。","answer":"花がさく。"},{"num":10,"k":"貝","reading":"かい","prompt":"海でかいをひろう。","answer":"海で貝をひろう。"},{"num":11,"k":"学","reading":"まな","prompt":"本を読んで まなぶ。","answer":"本を読んで 学ぶ。"},{"num":12,"k":"気","reading":"き","prompt":"元きにあいさつする。","answer":"元気にあいさつする。"},{"num":13,"k":"九","reading":"きゅう","prompt":"きゅう人いる。","answer":"九人いる。"},{"num":14,"k":"休","reading":"やす","prompt":"今日はやすむ。","answer":"今日は休む。"},{"num":15,"k":"玉","reading":"たま","prompt":"丸いたま。","answer":"丸い玉。"},{"num":16,"k":"金","reading":"かね","prompt":"おかねをはらう。","answer":"お金をはらう。"},{"num":17,"k":"空","reading":"そら","prompt":"そらを見上げる。","answer":"空を見上げる。"},{"num":18,"k":"月","reading":"つき","prompt":"つきが見える。","answer":"月が見える。"},{"num":19,"k":"犬","reading":"いぬ","prompt":"いぬとさんぽする。","answer":"犬とさんぽする。"},{"num":20,"k":"見","reading":"みる","prompt":"空を みる。","answer":"空を 見る。"},{"num":21,"k":"五","reading":"ご","prompt":"ご人で遊ぶ。","answer":"五人で遊ぶ。"},{"num":22,"k":"口","reading":"くち","prompt":"くちを開ける。","answer":"口を開ける。"},{"num":23,"k":"校","reading":"こう","prompt":"学こうへ 行く。","answer":"学校へ 行く。"},{"num":24,"k":"左","reading":"ひだり","prompt":"ひだりを向く。","answer":"左を向く。"},{"num":25,"k":"三","reading":"さん","prompt":"えんぴつが さん本ある。","answer":"えんぴつが 三本ある。"},{"num":26,"k":"山","reading":"やま","prompt":"やまに登る。","answer":"山に登る。"},{"num":27,"k":"子","reading":"こ","prompt":"こどもが遊ぶ。","answer":"子どもが遊ぶ。"},{"num":28,"k":"四","reading":"よ","prompt":"よ人で 並ぶ。","answer":"四人で 並ぶ。"},{"num":29,"k":"糸","reading":"いと","prompt":"いとを結ぶ。","answer":"糸を結ぶ。"},{"num":30,"k":"字","reading":"じ","prompt":"漢じを書く。","answer":"漢字を書く。"},{"num":31,"k":"耳","reading":"みみ","prompt":"みみで音を聞く。","answer":"耳で音を聞く。"},{"num":32,"k":"七","reading":"なな","prompt":"ななつの星。","answer":"七つの星。"},{"num":33,"k":"車","reading":"くるま","prompt":"くるまに乗る。","answer":"車に乗る。"},{"num":34,"k":"手","reading":"て","prompt":"てを洗う。","answer":"手を洗う。"},{"num":35,"k":"十","reading":"じゅう","prompt":"じゅう円玉。","answer":"十円玉。"},{"num":36,"k":"出","reading":"でる","prompt":"外へ でる。","answer":"外へ 出る。"},{"num":37,"k":"女","reading":"おんな","prompt":"おんなの人。","answer":"女の人。"},{"num":38,"k":"小","reading":"ちいさい","prompt":"ちいさい石。","answer":"小さい石。"},{"num":39,"k":"上","reading":"うえ","prompt":"机のうえ。","answer":"机の上。"},{"num":40,"k":"森","reading":"もり","prompt":"もりを歩く。","answer":"森を歩く。"},{"num":41,"k":"人","reading":"ひと","prompt":"たくさんのひと。","answer":"たくさんの人。"},{"num":42,"k":"水","reading":"みず","prompt":"みずを飲む。","answer":"水を飲む。"},{"num":43,"k":"正","reading":"ただしい","prompt":"ただしい答え。","answer":"正しい答え。"},{"num":44,"k":"生","reading":"せい","prompt":"せい活をする。","answer":"生活をする。"},{"num":45,"k":"青","reading":"あお","prompt":"あおい空。","answer":"青い空。"},{"num":46,"k":"夕","reading":"ゆう","prompt":"ゆう方になる。","answer":"夕方になる。"},{"num":47,"k":"石","reading":"いし","prompt":"いしをひろう。","answer":"石をひろう。"},{"num":48,"k":"赤","reading":"あか","prompt":"あかい花。","answer":"赤い花。"},{"num":49,"k":"千","reading":"せん","prompt":"せん円。","answer":"千円。"},{"num":50,"k":"川","reading":"かわ","prompt":"かわで遊ぶ。","answer":"川で遊ぶ。"},{"num":51,"k":"先","reading":"さき","prompt":"さきに行く。","answer":"先に行く。"},{"num":52,"k":"早","reading":"はやく","prompt":"はやく起きる。","answer":"早く起きる。"},{"num":53,"k":"草","reading":"くさ","prompt":"くさが生える。","answer":"草が生える。"},{"num":54,"k":"足","reading":"あし","prompt":"あしが速い。","answer":"足が速い。"},{"num":55,"k":"村","reading":"むら","prompt":"小さなむら。","answer":"小さな村。"},{"num":56,"k":"大","reading":"おおきな","prompt":"おおきな木。","answer":"大きな木。"},{"num":57,"k":"男","reading":"おとこ","prompt":"おとこの人。","answer":"男の人。"},{"num":58,"k":"竹","reading":"たけ","prompt":"たけが伸びる。","answer":"竹が伸びる。"},{"num":59,"k":"中","reading":"なか","prompt":"箱のなか。","answer":"箱の中。"},{"num":60,"k":"虫","reading":"むし","prompt":"むしを見つける。","answer":"虫を見つける。"},{"num":61,"k":"町","reading":"まち","prompt":"まちを歩く。","answer":"町を歩く。"},{"num":62,"k":"天","reading":"てん","prompt":"てん気がよい。","answer":"天気がよい。"},{"num":63,"k":"田","reading":"た","prompt":"たんぼで 米を作る。","answer":"田んぼで 米を作る。"},{"num":64,"k":"土","reading":"つち","prompt":"つちをほる。","answer":"土をほる。"},{"num":65,"k":"二","reading":"に","prompt":"に年生です。","answer":"二年生です。"},{"num":66,"k":"日","reading":"ひ","prompt":"ひがのぼる。","answer":"日がのぼる。"},{"num":67,"k":"入","reading":"はいる","prompt":"部屋に はいる。","answer":"部屋に 入る。"},{"num":68,"k":"年","reading":"とし","prompt":"新しいとし。","answer":"新しい年。"},{"num":69,"k":"白","reading":"しろ","prompt":"しろい紙。","answer":"白い紙。"},{"num":70,"k":"八","reading":"はち","prompt":"はち人いる。","answer":"八人いる。"},{"num":71,"k":"百","reading":"ひゃく","prompt":"ひゃく円。","answer":"百円。"},{"num":72,"k":"文","reading":"ぶん","prompt":"ぶんを書く。","answer":"文を書く。"},{"num":73,"k":"木","reading":"き","prompt":"きに のぼる。","answer":"木に のぼる。"},{"num":74,"k":"本","reading":"ほん","prompt":"ほんを読む。","answer":"本を読む。"},{"num":75,"k":"名","reading":"な","prompt":"な前を書く。","answer":"名前を書く。"},{"num":76,"k":"目","reading":"め","prompt":"めを閉じる。","answer":"目を閉じる。"},{"num":77,"k":"立","reading":"たつ","prompt":"その場に たつ。","answer":"その場に 立つ。"},{"num":78,"k":"力","reading":"ちから","prompt":"ちからを出す。","answer":"力を出す。"},{"num":79,"k":"林","reading":"はやし","prompt":"はやしを歩く。","answer":"林を歩く。"},{"num":80,"k":"六","reading":"ろく","prompt":"ろく人いる。","answer":"六人いる。"}],TOTAL=80,SETS=[[1, 15], [16, 30], [31, 45], [46, 60], [61, 75], [76, 80]],app=document.getElementById('app');let current=null,deck=[],i=0,retry=[],status=new Map(),flipped=false,roundNo=1;
function key(s,e){return `kanji_fixed_g${GRADE}_${s}_${e}`}function load(s,e){try{return JSON.parse(localStorage.getItem(key(s,e))||'{}')}catch(x){return {}}}function save(){if(!current)return;let o={};status.forEach((v,k)=>o[k]=v);localStorage.setItem(key(current.start,current.end),JSON.stringify(o))}
function showMenu(){let h=`<div class="topbar"><a class="homebtn" href="index.html">← 入口</a><div class="title">小学${GRADE}年</div></div><h1>小学${GRADE}年 漢字マスター</h1><div class="sub">${TOTAL}字｜15問ずつチェック</div><div class="menu"><div class="grid">`;for(const [s,e] of SETS){let st=load(s,e),done=Object.values(st).filter(v=>v==='good').length;h+=`<button class="setbtn" onclick="start(${s},${e})">小${GRADE}漢字・${s}～${e}問目まで<br><span class="small">${done?`○できた ${done}問`:'スタート'}</span></button>`}h+=`</div></div><div class="gradebox"><div class="grade-title">配当漢字 <span class="count">${TOTAL}字</span></div><div class="kanjilist">${QUESTIONS.map(x=>x.k).join('　')}</div></div><div class="note">問題文はHTML内に固定しています。書き順表示だけインターネット接続を使います。</div>`;app.innerHTML=h}
function start(s,e){current={start:s,end:e,questions:QUESTIONS.slice(s-1,e)};deck=[...current.questions];i=0;retry=[];flipped=false;roundNo=1;status=new Map();let st=load(s,e);current.questions.forEach(q=>{if(st[q.num])status.set(q.num,st[q.num])});render()}
function counts(){let g=0,r=0;current.questions.forEach(x=>{let s=status.get(x.num);if(s==='good')g++;else if(s)r++});return[g,r,current.questions.length-g-r]}

function targetAnswer(x){
  const i=x.answer.indexOf(x.k);
  if(i<0) return x.k;
  let end=i+1;
  // Show the target kanji plus immediately following hiragana (送り仮名) only.
  while(end<x.answer.length && /[ぁ-ゖ]/.test(x.answer[end])) end++;
  return x.answer.slice(i,end);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlightTarget(prompt,reading){
  const p=String(prompt), r=String(reading||'');
  if(!r)return esc(p);
  const idx=p.indexOf(r);
  if(idx<0)return esc(p);
  return esc(p.slice(0,idx))+'<span class="target-reading">'+esc(r)+'</span>'+esc(p.slice(idx+r.length));
}
function render(){if(i>=deck.length){if(retry.length){deck=[...retry];retry=[];i=0;roundNo++}else return done()}let x=deck[i],[g,r,n]=counts();app.innerHTML=`<div class="topbar"><button class="back" onclick="showMenu()">← 小${GRADE}一覧</button><div class="title">${current.start}～${current.end}問目</div></div><div class="stats"><div class="stat">できた <b>${g}</b></div><div class="stat">復習 <b>${r}</b></div><div class="stat">まだ <b>${n}</b></div></div><div class="progress"><div style="width:${Math.round(g/current.questions.length*100)}%"></div></div><div class="card" id="card" onclick="flip()"><div><div class="num">${x.num}問目 ｜ ${i+1}/${deck.length}${roundNo>1?`　復習${roundNo-1}回目`:''}</div><div class="q">${highlightTarget(x.prompt,x.reading)}</div><div class="hint">紙に書いてからカードをタップ</div></div></div><div class="buttons"><button class="judge bad" onclick="judge('bad',event)">× もう一度</button><button class="judge maybe" onclick="judge('maybe',event)">△ あやしい</button><button class="judge good" onclick="judge('good',event)">○ できた</button></div><button class="reset" onclick="restart()">このセットを最初から</button>`}
function flip(){if(!current||i>=deck.length)return;flipped=!flipped;let x=deck[i],c=document.getElementById('card');if(!flipped){render();return}c.innerHTML=`<div><div class="big">${x.k}</div><div class="answer">${x.answer}</div><div class="reading">赤字：${x.reading} → ${targetAnswer(x)}</div><div class="stroke" id="stroke">読み込み中…</div><button class="replay" onclick="event.stopPropagation();stroke('${x.k}')">▶ 書き順をもう一度</button><div class="hint">下のボタンで自己採点</div></div>`;stroke(x.k)}
function judge(v,e){e.stopPropagation();let x=deck[i];status.set(x.num,v);if(v!=='good')retry.push(x);i++;save();flipped=false;render()}function restart(){deck=[...current.questions];i=0;retry=[];status=new Map();flipped=false;roundNo=1;localStorage.removeItem(key(current.start,current.end));render()}
function done(){save();let[g,r,n]=counts(),weak=current.questions.filter(x=>status.get(x.num)!=='good');app.innerHTML=`<div class="topbar"><button class="back" onclick="showMenu()">← 小${GRADE}一覧</button><div class="title">セット完了</div></div><div class="card"><div class="done">おつかれさま！ 🎉<br><span style="font-size:16px;font-weight:400">${current.start}～${current.end}問目：${g}問できた</span>${weak.length?`<div class="result">もう一度確認：${weak.map(x=>x.num+'「'+x.k+'」').join('、')}</div>`:`<div class="result">このセットは全問クリア！</div>`}</div></div><button class="reset" onclick="restart()">もう一度やる</button><button class="reset" onclick="showMenu()">小${GRADE}一覧へ</button>`}
async function stroke(ch){let box=document.getElementById('stroke');if(!box)return;let code=ch.codePointAt(0).toString(16).padStart(5,'0');try{let r=await fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${code}.svg`);if(!r.ok)throw 0;let t=await r.text(),d=new DOMParser().parseFromString(t,'image/svg+xml'),svg=d.documentElement;svg.setAttribute('viewBox','0 0 109 109');svg.removeAttribute('width');svg.removeAttribute('height');svg.querySelectorAll('text,circle').forEach(e=>e.remove());box.innerHTML='';box.appendChild(document.importNode(svg,true));let ps=[...box.querySelectorAll('g[id^="kvg:StrokePaths_"] path')];if(!ps.length)ps=[...box.querySelectorAll('path')];ps.forEach(p=>{p.style.fill='none';p.style.stroke='#222';p.style.strokeWidth='3.2';p.style.strokeLinecap='round';p.style.strokeLinejoin='round';let l=p.getTotalLength();p.style.strokeDasharray=`${l} ${l}`;p.style.strokeDashoffset=l;p.style.transition='none'});requestAnimationFrame(()=>requestAnimationFrame(()=>ps.forEach((p,j)=>{p.style.transition=`stroke-dashoffset .42s ease ${j*.48}s`;p.style.strokeDashoffset=0})))}catch(e){box.textContent='書き順を読み込めませんでした'}}
showMenu();</script></body></html>
