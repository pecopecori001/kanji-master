<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小4まで漢字マスター</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;font-family:"UD Digi Kyokasho NK-R","Yu Kyokasho","游教科書体","Noto Serif JP",serif;color:#222}
.app{max-width:720px;margin:auto;padding:14px 12px 30px}h1{text-align:center;font-size:23px;margin:5px 0}.sub{text-align:center;font-size:12px;color:#666;margin-bottom:12px}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.homebtn,.back{border:0;border-radius:10px;padding:9px 12px;background:#e8e8e8;font-weight:700;cursor:pointer;text-decoration:none;color:#222}.title{font-weight:800;font-size:18px;flex:1;text-align:center}
.gradebox,.menu{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 15px #0001}.grade-title{font-weight:800;font-size:19px;display:flex;justify-content:space-between;align-items:center}.count{font-size:12px;color:#777;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.setbtn,.gradebtn{border:0;border-radius:13px;padding:13px 8px;background:#e8f3ff;font-weight:700;cursor:pointer;line-height:1.45;text-align:center;text-decoration:none;color:#222;display:block}.small{font-size:10px;font-weight:400;color:#666}.kanjilist{font-size:14px;line-height:1.9;color:#555;margin-top:12px;letter-spacing:.14em;background:#fafafa;border-radius:10px;padding:9px}
.stats{display:flex;gap:5px;margin:7px 0}.stat{flex:1;background:#fff;border-radius:10px;padding:7px 4px;text-align:center;font-size:11px}.stat b{font-size:16px;margin-left:3px}
.card{background:#fff;min-height:300px;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 18px #0001;cursor:pointer;user-select:none}.q{font-size:25px;line-height:1.65;font-weight:600}.num{font-size:13px;color:#777;margin-bottom:10px}.big{font-size:70px;line-height:1.1}.answer{font-size:25px;line-height:1.55;margin-top:5px;font-weight:700}.reading{font-size:18px;color:#555;margin-top:3px}
.stroke{width:132px;height:132px;margin:8px auto;border:1px solid #ddd;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff}.stroke svg{width:124px;height:124px}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;position:sticky;bottom:5px;background:#f5f4ef;padding-top:5px}.judge{border:0;border-radius:12px;padding:11px 3px;font-weight:700;font-size:14px;cursor:pointer}.bad{background:#ffdeda}.maybe{background:#fff0c9}.good{background:#dcefdc}
.reset{width:100%;border:0;border-radius:12px;margin-top:7px;padding:10px;background:#e8e8e8;font-weight:700;cursor:pointer}.hint{font-size:11px;color:#888;margin-top:8px}.replay{border:0;border-radius:10px;background:#e8f3ff;color:#1261a0;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer}.done{font-size:23px;font-weight:700;line-height:1.6}.result{font-size:14px;line-height:1.8;margin-top:8px}.progress{height:8px;background:#e6e6e6;border-radius:6px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:#aaa}.note{font-size:10px;color:#888;text-align:center;margin-top:10px;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}
</style></head><body><div class="app"><h1>小4まで漢字マスター</h1><div class="sub">小1〜小4・642字を学年別にチェック</div><div class="gradebox"><div class="grade-title">学年を選ぶ <span class="count">全642字</span></div><div class="grid"><a class="gradebtn" href="小１漢字80字.html">小学1年<br><span class="small">80字・15問ずつ</span></a><a class="gradebtn" href="小２漢字160字.html">小学2年<br><span class="small">160字・15問ずつ</span></a><a class="gradebtn" href="小３漢字200字.html">小学3年<br><span class="small">200字・15問ずつ</span></a><a class="gradebtn" href="小４漢字202字.html">小学4年<br><span class="small">202字・15問ずつ</span></a></div></div><div class="note">各学年は別HTMLです。全学年、短い例文の中のひらがなを漢字に直す固定問題です。</div></div></body></html>
