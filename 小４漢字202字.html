function key(s,e){return `kanji_fixed_g${GRADE}_${s}_${e}`}function load(s,e){try{return JSON.parse(localStorage.getItem(key(s,e))||'{}')}catch(x){return {}}}function save(){if(!current)return;let o={};status.forEach((v,k)=>o[k]=v);localStorage.setItem(key(current.start,current.end),JSON.stringify(o))}
function showMenu(){let h=`<div class="topbar"><a class="homebtn" href="index.html">← 入口</a><div class="title">小学${GRADE}年</div></div><h1>小学${GRADE}年 漢字マスター</h1><div class="sub">${TOTAL}字｜15問ずつチェック</div><div class="menu"><div class="grid">`;for(const [s,e] of SETS){let st=load(s,e),done=Object.values(st).filter(v=>v==='good').length;h+=`<button class="setbtn" onclick="start(${s},${e})">小${GRADE}漢字・${s}～${e}問目まで<br><span class="small">${done?`○できた ${done}問`:'スタート'}</span></button>`}h+=`</div></div><div class="gradebox"><div class="grade-title">配当漢字 <span class="count">${TOTAL}字</span></div><div class="kanjilist">${QUESTIONS.map(x=>x.k).join('　')}</div></div><div class="note">短い例文の中のひらがなを漢字に直す問題です。問題文はHTML内に固定しています。</div>`;app.innerHTML=h}
function start(s,e){current={start:s,end:e,questions:QUESTIONS.slice(s-1,e)};deck=[...current.questions];i=0;retry=[];flipped=false;roundNo=1;status=new Map();let st=load(s,e);current.questions.forEach(q=>{if(st[q.num])status.set(q.num,st[q.num])});render()}
function counts(){let g=0,r=0;current.questions.forEach(x=>{let s=status.get(x.num);if(s==='good')g++;else if(s)r++});return[g,r,current.questions.length-g-r]}

function targetAnswer(x){
  const i=x.answer.indexOf(x.k);
  if(i<0) return x.k;
  let end=i+1;
  // Show the target kanji plus immediately following hiragana (送り仮名) only.
  while(end<x.answer.length && /[ぁ-ゖ]/.test(x.answer[end])) end++;
  return x.answer.slice(i,end);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlightTarget(prompt,reading){
  const p=String(prompt), r=String(reading||'');
  if(!r)return esc(p);
  const idx=p.indexOf(r);
  if(idx<0)return esc(p);
  return esc(p.slice(0,idx))+'<span class="target-reading">'+esc(r)+'</span>'+esc(p.slice(idx+r.length));
}
function render(){if(i>=deck.length){if(retry.length){deck=[...retry];retry=[];i=0;roundNo++}else return done()}let x=deck[i],[g,r,n]=counts();app.innerHTML=`<div class="topbar"><button class="back" onclick="showMenu()">← 小${GRADE}一覧</button><div class="title">${current.start}～${current.end}問目</div></div><div class="stats"><div class="stat">できた <b>${g}</b></div><div class="stat">復習 <b>${r}</b></div><div class="stat">まだ <b>${n}</b></div></div><div class="progress"><div style="width:${Math.round(g/current.questions.length*100)}%"></div></div><div class="card" id="card" onclick="flip()"><div><div class="num">${x.num}問目 ｜ ${i+1}/${deck.length}${roundNo>1?`　復習${roundNo-1}回目`:''}</div><div class="q">${highlightTarget(x.prompt,x.reading)}</div><div class="hint">紙に書いてからカードをタップ</div></div></div><div class="buttons"><button class="judge bad" onclick="judge('bad',event)">× もう一度</button><button class="judge maybe" onclick="judge('maybe',event)">△ あやしい</button><button class="judge good" onclick="judge('good',event)">○ できた</button></div><button class="reset" onclick="restart()">このセットを最初から</button>`}
function flip(){if(!current||i>=deck.length)return;flipped=!flipped;let x=deck[i],c=document.getElementById('card');if(!flipped){render();return}c.innerHTML=`<div><div class="big">${x.k}</div><div class="answer">${x.answer}</div><div class="reading">赤字：${x.reading} → ${targetAnswer(x)}</div><div class="stroke" id="stroke">読み込み中…</div><button class="replay" onclick="event.stopPropagation();stroke('${x.k}')">▶ 書き順をもう一度</button><div class="hint">下のボタンで自己採点</div></div>`;stroke(x.k)}
function judge(v,e){e.stopPropagation();let x=deck[i];status.set(x.num,v);if(v!=='good')retry.push(x);i++;save();flipped=false;render()}function restart(){deck=[...current.questions];i=0;retry=[];status=new Map();flipped=false;roundNo=1;localStorage.removeItem(key(current.start,current.end));render()}
function done(){save();let[g,r,n]=counts(),weak=current.questions.filter(x=>status.get(x.num)!=='good');app.innerHTML=`<div class="topbar"><button class="back" onclick="showMenu()">← 小${GRADE}一覧</button><div class="title">セット完了</div></div><div class="card"><div class="done">おつかれさま！ 🎉<br><span style="font-size:16px;font-weight:400">${current.start}～${current.end}問目：${g}問できた</span>${weak.length?`<div class="result">もう一度確認：${weak.map(x=>x.num+'「'+x.k+'」').join('、')}</div>`:`<div class="result">このセットは全問クリア！</div>`}</div></div><button class="reset" onclick="restart()">もう一度やる</button><button class="reset" onclick="showMenu()">小${GRADE}一覧へ</button>`}
async function stroke(ch){let box=document.getElementById('stroke');if(!box)return;let code=ch.codePointAt(0).toString(16).padStart(5,'0');try{let r=await fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${code}.svg`);if(!r.ok)throw 0;let t=await r.text(),d=new DOMParser().parseFromString(t,'image/svg+xml'),svg=d.documentElement;svg.setAttribute('viewBox','0 0 109 109');svg.removeAttribute('width');svg.removeAttribute('height');svg.querySelectorAll('text,circle').forEach(e=>e.remove());box.innerHTML='';box.appendChild(document.importNode(svg,true));let ps=[...box.querySelectorAll('g[id^="kvg:StrokePaths_"] path')];if(!ps.length)ps=[...box.querySelectorAll('path')];ps.forEach(p=>{p.style.fill='none';p.style.stroke='#222';p.style.strokeWidth='3.2';p.style.strokeLinecap='round';p.style.strokeLinejoin='round';let l=p.getTotalLength();p.style.strokeDasharray=`${l} ${l}`;p.style.strokeDashoffset=l;p.style.transition='none'});requestAnimationFrame(()=>requestAnimationFrame(()=>ps.forEach((p,j)=>{p.style.transition=`stroke-dashoffset .42s ease ${j*.48}s`;p.style.strokeDashoffset=0})))}catch(e){box.textContent='書き順を読み込めませんでした'}}
